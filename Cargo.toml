[package]
name = "pcap-toolkit"
authors = ["Sébastien LUNDI"]
description = "A blazing-fast, data-oriented PCAP manipulation, routing, and transformation tool written in Rust"
readme = "README.md"
license = "Apache-2.0"
repository = "https://codeberg.org/slundi/pcap-toolkit"
keywords = ["pcap", "network", "packet", "capture", "forensics"]
categories = ["command-line-utilities", "network-programming", "parser-implementations"]
version = "0.1.0"
edition = "2024" # requires Rust >= 1.85 (stable as of Feb 2025)

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pcap_toolkit"
path = "src/lib.rs"

[[bin]]
name = "pcap-toolkit"
path = "src/main.rs"

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    # "x86_64-apple-darwin",
    # "x86_64-pc-windows-msvc",
    # "i686-unknown-linux-gnu",
    # "i686-pc-windows-msvc"
]


[dependencies]
anyhow = "1.0.102"
apache-avro = { version = "0.21", features = ["zstandard"] }
base64 = "0.22"
bpaf = "0.9.26"
chrono = { version = "0.4.44", features = ["serde"] }
etherparse = "0.20.1"
parquet = { version = "53", default-features = false, features = ["zstd", "snap"] }
pcap-parser = "0.17.0"
rapidhash = "4.4.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2.0.18"
toml-span = "0.7.1"
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.5", features = ["all"] }


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[example]]
name = "basic"


[package.metadata.cargo-machete]
ignored = []

# --- Profiles ---

# Standard Dev Profile (Optimized for speed of compilation)
[profile.dev]
opt-level = 0
debug = true

# Production Release Profile
# This ensures the Nix-built binary is highly optimized
[profile.release]
opt-level = 3     # Max optimizations
lto = "fat"       # Link Time Optimization (smaller, faster binary)
codegen-units = 1 # Better optimizations at the cost of compile time
panic = "abort"   # Removes stack unwinding (smaller binary size)
strip = true      # Automatically strips symbols/debug info (like 'strip' command)

# Profile for Benchmarking
[profile.bench]
extend = "release"
debug = false

# --- Features ---
# [features]
# default = []
# async = ["dep:tokio"] # must be in dependencies

# --- cargo-dist ---
# Run `cargo dist init` to generate full CI integration.
# This project uses its own release workflow (.github/workflows/release.yaml);
# set dist = true here only if you want cargo-dist to manage releases instead.
[workspace.metadata.dist]
dist = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
