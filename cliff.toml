[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
Generated by [git-cliff](https://git-cliff.org/) from [Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Only user-facing changes appear in the changelog.
# Internal commit types (refactor, test, chore, ci, build, style) are skipped
# because they don't affect end users — reviewers can consult git log for those.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { body = ".*security", group = "Security" },
  { message = "^refactor", skip = true }, # internal code restructuring, no user impact
  { message = "^test", skip = true }, # test-only changes
  { message = "^chore", skip = true }, # maintenance (deps, tooling, formatting)
  { message = "^ci", skip = true }, # CI/CD pipeline changes
  { message = "^build", skip = true }, # build system changes
  { message = "^style", skip = true }, # whitespace/formatting only
]
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
