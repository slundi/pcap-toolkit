# Build the Linux release binaries and publish them to the Codeberg release
# matching the pushed `v*` tag.
#
# Asset contract (consumed by install.sh and .forgejo/workflows/docker-release.yml):
#   - archive name:   pcap-toolkit-<tag>-<target>.tar.gz
#   - archive layout: pcap-toolkit-<tag>-<target>/pcap-toolkit   (binary wrapped in a dir)
#   - checksums file: pcap-toolkit-<tag>-SHA256SUMS
#   where <tag> is the full tag including the leading "v" (e.g. v0.4.0).
#
# The musl targets are fully static (no glibc / no ld.so) and are the
# recommended download — they run on any Linux (old Debian, Alpine,
# distroless, scratch). gnu builds are kept for parity.
#
# macOS and Windows are not built here (Codeberg has no such runners); those
# assets, if needed, must be uploaded to the same release by another means.
#
# Auth: uses the automatic per-run token (GITHUB_TOKEN, provided by Forgejo
# Actions) with contents:write on this repo. No extra secret required.
#
# Runner: a docker-capable Forgejo Actions runner (same class as docker-release).

name: release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: pcap-toolkit
  # cross launches its own containers; tell it we are already inside one.
  CROSS_CONTAINER_IN_CONTAINER: "true"

jobs:
  release:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build, package and checksum
        env:
          VER: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # target:builder  — "cross" for cross-compiled arches, "cargo" for native x86_64.
          targets="
            x86_64-unknown-linux-musl:cross
            aarch64-unknown-linux-musl:cross
            x86_64-unknown-linux-gnu:cargo
            aarch64-unknown-linux-gnu:cross
            armv7-unknown-linux-gnueabihf:cross
            i686-unknown-linux-gnu:cross
          "

          for entry in $targets; do
            target="${entry%%:*}"
            builder="${entry##*:}"
            echo "::group::build $target ($builder)"
            if [ "$builder" = "cross" ]; then
              cross build --release --locked --target "$target"
            else
              rustup target add "$target"
              cargo build --release --locked --target "$target"
            fi
            echo "::endgroup::"

            stage="${BINARY_NAME}-${VER}-${target}"
            mkdir -p "$stage"
            cp "target/${target}/release/${BINARY_NAME}" "$stage/"
            tar czf "dist/${stage}.tar.gz" "$stage"
            rm -rf "$stage"
          done

          # Checksums over the bare archive names (install.sh greps " <asset>$").
          ( cd dist && sha256sum ${BINARY_NAME}-${VER}-*.tar.gz > "${BINARY_NAME}-${VER}-SHA256SUMS" )
          ls -la dist

      - name: Publish to Codeberg release
        env:
          VER: ${{ steps.ver.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"

          # Reuse the release if it already exists (e.g. re-run), else create it.
          rel_id="$(curl -fsSL -H "$auth" "${api}/releases/tags/${VER}" 2>/dev/null \
            | grep -m1 '"id"' | grep -oE '[0-9]+' || true)"
          if [ -z "$rel_id" ]; then
            rel_id="$(curl -fsSL -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${VER}\",\"name\":\"${VER}\",\"generate_release_notes\":true}" \
              "${api}/releases" | grep -m1 '"id"' | grep -oE '[0-9]+')"
          fi
          echo "release id: $rel_id"

          for f in dist/*; do
            name="$(basename "$f")"
            echo "uploading $name"
            curl -fsSL -H "$auth" \
              -F "attachment=@${f};filename=${name}" \
              "${api}/releases/${rel_id}/assets?name=${name}" >/dev/null
          done
