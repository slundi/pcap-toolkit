# Build a multi-arch (linux/amd64 + linux/arm64) Docker image from the
# binaries attached to the Codeberg release matching the pushed tag, and
# publish it to GHCR + Docker Hub.
#
# This sketch is standalone — it does not depend on a binary-build job. It
# fetches the Linux MUSL tarballs from the Codeberg release for the tag,
# so the release must already exist when this workflow runs.
#
# Required repository secrets (Codeberg → Settings → Actions → Secrets):
#   GHCR_USERNAME      — your GitHub username (e.g. slundi)
#   GHCR_TOKEN         — GitHub PAT with `write:packages` scope
#   DOCKERHUB_USERNAME — Docker Hub username (e.g. slundi)
#   DOCKERHUB_TOKEN    — Docker Hub access token with read/write/delete
#
# Runner: requires a Forgejo Actions runner with docker available.

name: docker-release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Fetch release binaries from Codeberg
        env:
          VER: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://codeberg.org/slundi/pcap-toolkit/releases/download/${VER}"
          for pair in "amd64:x86_64-unknown-linux-musl" "arm64:aarch64-unknown-linux-musl"; do
            docker_arch="${pair%%:*}"
            rust_target="${pair##*:}"
            archive="pcap-toolkit-${VER}-${rust_target}.tar.gz"
            echo "fetching $archive"
            curl -fsSL "${base}/${archive}" -o "${archive}"
            tar -xzf "${archive}"
            mv "pcap-toolkit-${VER}-${rust_target}/pcap-toolkit" "pcap-toolkit-linux-${docker_arch}"
            rm -rf "pcap-toolkit-${VER}-${rust_target}" "${archive}"
          done
          ls -la pcap-toolkit-linux-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VER: ${{ steps.ver.outputs.tag }}
        run: |
          # Strip leading "v" for semver tags so `:0.2.0` and `:0.2` work too.
          semver="${VER#v}"
          major="${semver%%.*}"
          minor="${semver%.*}"
          {
            echo "ghcr.io/slundi/pcap-toolkit:${VER}"
            echo "ghcr.io/slundi/pcap-toolkit:${semver}"
            echo "ghcr.io/slundi/pcap-toolkit:${minor}"
            echo "ghcr.io/slundi/pcap-toolkit:${major}"
            echo "ghcr.io/slundi/pcap-toolkit:latest"
            echo "docker.io/slundi/pcap-toolkit:${VER}"
            echo "docker.io/slundi/pcap-toolkit:${semver}"
            echo "docker.io/slundi/pcap-toolkit:${minor}"
            echo "docker.io/slundi/pcap-toolkit:${major}"
            echo "docker.io/slundi/pcap-toolkit:latest"
          } > .image-tags
          {
            echo "tags<<EOF"
            cat .image-tags
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
